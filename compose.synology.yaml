services:
  postgres:
    image: postgres:18-bookworm
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: olconet
      POSTGRES_USER: olconet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [olconet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olconet -d olconet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  backend:
    depends_on:
      postgres: { condition: service_healthy }
  migrate:
    depends_on:
      postgres: { condition: service_healthy }
  create-admin:
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
