services:
  backend:
    networks: [olconet, back-tier]
    volumes:
      - type: bind
        source: /volume1/server/olconet/uploads
        target: /data/uploads
        bind:
          create_host_path: false
  migrate:
    networks: [olconet, back-tier]
  create-admin:
    networks: [olconet, back-tier]

networks:
  back-tier:
    external: true
    name: back-tier
