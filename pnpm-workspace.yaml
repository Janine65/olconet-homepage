  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: true
  sharp: true

permissions:
  dotenv:
    skills: false
